name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Cobb_Totem's lakefile does `require «TotemArtifact» from "../"`, so the
      # Lean build (driven by cargo test via `lake env lean --stdin`) needs the
      # superproject's root package present one directory up. Check the
      # superproject out into `totem/` and the ref under test into
      # `totem/Cobb_Totem/`, then run every build step from there.
      - name: Checkout TotemArtifact superproject
        uses: actions/checkout@v4
        with:
          repository: Pat-Lafon/Totem_Artifact
          path: totem

      - name: Checkout Cobb_Totem under test
        uses: actions/checkout@v4
        with:
          path: totem/Cobb_Totem

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            totem/Cobb_Totem/target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('totem/Cobb_Totem/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      - name: Install elan (Lean version manager)
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Cache Lake packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            totem/.lake
            totem/Cobb_Totem/.lake
          key: ${{ runner.os }}-lake-${{ hashFiles('totem/Cobb_Totem/lakefile.lean', 'totem/Cobb_Totem/lake-manifest.json') }}
          restore-keys: |
            ${{ runner.os }}-lake-

      - name: Setup Lean dependencies
        working-directory: totem/Cobb_Totem
        run: lake build ProofAutomation.ProveAxiom

      - name: Build
        working-directory: totem/Cobb_Totem
        run: cargo build --verbose

      - name: Run tests
        working-directory: totem/Cobb_Totem
        run: cargo test --verbose

  clippy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-

      - name: Run clippy
        run: cargo clippy -- -D warnings

  fmt:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt -- --check
